name: Go

on:
  pull_request:
    branches: [ "main", "release/**" ]

permissions:
  contents: read

jobs:
  build:
    name: "Build and Test"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...
